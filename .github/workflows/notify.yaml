name: Upload Release Asset and Notify Webhook

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for testing'
        required: true
      release_name:
        description: 'Release name'
        required: true
      release_body:
        description: 'Release body'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Send Release Webhook
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          RELEASE_NAME=${{ github.event.release.name }}
          RELEASE_TAG=${{ github.event.release.tag_name }}
          RELEASE_BODY=${{ github.event.release.body }}
          RELEASE_URL=${{ github.event.release.html_url }}
          
          # Webhook用のJSON作成
          JSON_PAYLOAD=$(jq -n \
            --arg content "<@&1090816431937040437>\n\n**${RELEASE_NAME}** update\n\n\`\`\`\n${RELEASE_BODY}\n\`\`\`\n[Release](${RELEASE_URL}) - [Other releases](https://github.com/${{ github.repository }}/releases)" \
            '{content: $content}')
          
          curl -H "Content-Type: application/json" -X POST -d "$JSON_PAYLOAD" $WEBHOOK_URL